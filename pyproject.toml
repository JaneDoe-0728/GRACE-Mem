[project]
name = "grace-mem"
version = "0.1.0"
description = "Graph-based long-term conversational memory research framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.10.0",
    "chromadb>=1.0.20",
    "dateparser>=1.2.2",
    "diffusers>=0.35.1",
    "faiss-cpu>=1.13.2",
    "falkordb>=1.6.0",
    "flask>=3.1.1",
    "httpx>=0.28.1",
    "huggingface-hub>=0.23.0",
    "llmlingua>=0.2.2",
    "nltk>=3.9.2",
    "openai>=1.100.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.1.1",
    "pytest>=9.0.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.7.0",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.41.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs a live FalkorDB, an LLM endpoint and the downloaded models; skips itself when they are absent",
    "slow: spawns a subprocess (e.g. a pipeline --help) and takes seconds rather than milliseconds",
]

[tool.ruff.lint]
ignore = [
    # Pipeline boundaries deliberately catch third-party/runtime failures so a
    # single backend or cleanup error does not abort an experiment batch.
    "BLE001",
    "S110",
    "S112",
    # Dataset timestamps are intentionally timezone-naive for compatibility
    # with the source CSV/JSON formats and existing experiment artifacts.
    "DTZ001",
    "DTZ003",
    "DTZ005",
    "DTZ007",
    # Keep payload-validation exception types and Python 3.10-compatible
    # context-manager annotations stable as part of the existing API.
    "PYI034",
    "PYI036",
    "TRY004",
]

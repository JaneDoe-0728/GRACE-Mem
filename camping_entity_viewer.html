<style>

  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0; font-size: 14px; }

  .top-tab:hover { color: #a0aec0; }
  .top-tab.active { color: #818cf8; border-bottom-color: #818cf8; }

  .top-panel.active { display: flex; }

  .sidebar { background: #141722; border-right: 1px solid #2d3748; overflow-y: auto; padding: 12px 0; width: 250px; flex-shrink: 0; }

  .entity-btn { width: 100%; text-align: left; background: none; border: none; padding: 8px 16px; cursor: pointer; color: #a0aec0; display: flex; align-items: center; gap: 10px; border-left: 3px solid transparent; }
  .entity-btn:hover { background: #1e2233; color: #e2e8f0; }
  .entity-btn.active { background: #1e2233; color: #fff; border-left-color: #6366f1; }
  .type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ename { font-weight: 500; font-size: 13px; }
  .esub { font-size: 11px; color: #4a5568; margin-top: 1px; }

  .main { overflow-y: auto; padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 16px; }

  /* ── QA panel ── */
  .qa-layout { display: grid; grid-template-columns: 280px 1fr; width: 100%; }
  .qa-sidebar { background: #141722; border-right: 1px solid #2d3748; overflow-y: auto; padding: 10px 0; }
  .qa-main { overflow-y: auto; padding: 20px; }

  .qa-item-btn { width: 100%; text-align: left; background: none; border: none; padding: 9px 14px; cursor: pointer; color: #a0aec0; border-left: 3px solid transparent; display: flex; flex-direction: column; gap: 3px; }
  .qa-item-btn:hover { background: #1e2233; }
  .qa-item-btn.active { background: #1e2233; border-left-color: #6366f1; }
  .qa-q-preview { font-size: 12px; color: #cbd5e1; line-height: 1.4; }
  .qa-meta { display: flex; gap: 6px; align-items: center; }
  .cat-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
  .cat-1 { background: #1e3a5f; color: #93c5fd; }
  .cat-2 { background: #1a2e1a; color: #86efac; }
  .cat-3 { background: #2d1f00; color: #fcd34d; }
  .cat-4 { background: #2d1515; color: #fca5a5; }
  .score-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .ver-dot { width: 8px; height: 8px; border-radius: 50%; }
  .correct { background: #22c55e; }
  .wrong { background: #ef4444; }

  /* QA detail */
  .qa-header-card { background: #1a1d2e; border: 1px solid #2d3748; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .qa-question { font-size: 16px; font-weight: 600; color: #f0f4ff; margin-bottom: 8px; }
  .qa-gold { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .qa-gold-label { font-size: 11px; color: #4a5568; font-weight: 600; text-transform: uppercase; }
  .qa-gold-val { color: #4ade80; font-weight: 600; }
  .qa-evidence { font-size: 11px; color: #4a5568; }

  .ver-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
  .ver-card { background: #1a1d2e; border: 1px solid #2d3748; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ver-card.correct-card { border-color: #166534; }
  .ver-card.wrong-card { border-color: #7f1d1d; }
  .ver-name { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #4a5568; display: flex; align-items: center; gap: 6px; }
  .ver-answer { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
  .ver-answer strong { font-weight: 600; }
  .correct-mark { color: #22c55e; font-size: 14px; }
  .wrong-mark { color: #ef4444; font-size: 14px; }

  /* Context panel */
  .ctx-card { background: #1a1d2e; border: 1px solid #2d3748; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .ctx-header { background: #141722; padding: 8px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2d3748; }
  .ctx-ver-name { font-size: 12px; font-weight: 700; color: #818cf8; }
  .ctx-conf { font-size: 11px; color: #4a5568; }
  .ctx-fail { font-size: 11px; color: #f87171; }
  .ctx-body { padding: 12px 14px; font-family: monospace; font-size: 12px; color: #94a3b8; line-height: 1.7; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
  .ctx-tabs { display: flex; gap: 0; border-bottom: 1px solid #2d3748; padding: 0 14px; }
  .ctx-tab { padding: 6px 12px; cursor: pointer; font-size: 12px; color: #4a5568; border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; }
  .ctx-tab.active { color: #818cf8; border-bottom-color: #818cf8; }

  /* shared */

  .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #4a5568; margin-bottom: 8px; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid #2d3748; }
  .tab { padding: 8px 18px; cursor: pointer; font-size: 13px; color: #64748b; border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; }
  .tab:hover { color: #a0aec0; }
  .tab.active { color: #818cf8; border-bottom-color: #818cf8; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Entity styles */
  .entity-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .entity-name { font-size: 19px; font-weight: 700; color: #f0f4ff; }
  .type-pill { padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; margin-top: 4px; display: inline-block; }
  .type-event { background: #1e1b4b; color: #a5b4fc; }
  .type-location { background: #14532d; color: #86efac; }
  .type-timespan { background: #1c1917; color: #d6d3d1; }
  .problem-badge { display: inline-flex; align-items: center; gap: 5px; background: #2d1515; color: #f87171; border-radius: 5px; padding: 3px 9px; font-size: 11px; font-weight: 600; margin-top: 6px; }
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: #2d3748; }
  .tl-item { position: relative; margin-bottom: 20px; }
  .tl-dot { position: absolute; left: -23px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #4a5568; border: 2px solid #1a1d2e; z-index: 1; }
  .tl-dot.first { background: #22c55e; }
  .tl-dot.last { background: #ef4444; }
  .tl-dot.mid { background: #f59e0b; }
  .tl-sessions { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .session-tag { padding: 2px 8px; border-radius: 5px; font-size: 11px; font-family: monospace; background: #2d3748; color: #94a3b8; cursor: pointer; }
  .session-tag:hover { background: #374151; color: #e2e8f0; }
  .session-tag.new { background: #1e3a2f; color: #4ade80; }
  .tl-desc { background: #0f1117; border: 1px solid #2d3748; border-radius: 6px; padding: 12px; line-height: 1.6; color: #cbd5e1; }
  .tl-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tl-step { font-size: 11px; font-weight: 700; color: #4a5568; }
  .session-selector { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .session-header { background: #141722; border: 1px solid #2d3748; border-radius: 8px 8px 0 0; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .session-id { font-family: monospace; font-size: 12px; color: #818cf8; font-weight: 700; }
  .session-date-lbl { font-size: 12px; color: #4a5568; }
  .turns { border: 1px solid #2d3748; border-top: none; border-radius: 0 0 8px 8px; }
  .turn { padding: 10px 16px; border-bottom: 1px solid #1a1d2e; display: flex; gap: 12px; }
  .turn:last-child { border-bottom: none; }
  .turn.hl { background: #1e2a1e; }
  .turn-speaker { min-width: 70px; font-weight: 600; font-size: 12px; color: #818cf8; }
  .turn-speaker.caroline { color: #f59e0b; }
  .turn-id { font-family: monospace; font-size: 10px; color: #374151; min-width: 44px; padding-top: 2px; }
  .turn-text { color: #cbd5e1; line-height: 1.55; }
  .turn-text mark { background: #1e3a2f; color: #86efac; border-radius: 2px; padding: 0 2px; }
  .empty-state { color: #374151; text-align: center; padding: 40px; font-size: 13px; }
  .dot-event { background: #818cf8; }
  .dot-location { background: #4ade80; }
  .dot-timespan { background: #94a3b8; }
  .dot-person { background: #fbbf24; }
  .gt-entity { background: #0a1628; border: 1px solid #1e3a5f; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .gt-entity-name { font-weight: 700; color: #93c5fd; margin-bottom: 4px; }
  .gt-type { font-size: 11px; color: #1e40af; background: #1e3a5f; border-radius: 4px; padding: 1px 7px; display: inline-block; margin-bottom: 8px; }
  .gt-desc { color: #94a3b8; line-height: 1.6; font-size: 13px; }
  .gt-note { font-size: 11px; color: #f59e0b; margin-top: 6px; }
</style>

}
function renderSessionRaw(sid) {
  const s = SESSIONS[sid];
  if (!s) return `<div class="empty-state">No data for ${sid}</div>`;
  const turns = s.relevant_turns.map(t =>
    `<div class="turn ${t.hl?'hl':''}">
      <span class="turn-id">${t.dia_id}</span>
      <span class="turn-speaker ${t.speaker==='Caroline'?'caroline':''}">${t.speaker}</span>
      <span class="turn-text">${t.text}</span>
    </div>`).join('');
  return `<div class="session-header"><span class="session-id">${sid}</span><span class="session-date-lbl">${s.date}</span></div><div class="turns">${turns}</div>`;
}
function showEntitySession(sid) {
  document.getElementById('entity-session-display').innerHTML = renderSessionRaw(sid);
}

function renderEntityView(key) {
  const e = ENTITIES[key];
  if (!e) return '';
  const allSessions = [];
  const seen = new Set();
  e.versions.forEach(v => v.sources.forEach(([sid]) => { if (!seen.has(sid)) { seen.add(sid); allSessions.push(sid); } }));
  const tl = e.versions.map((v, i) => {
    const dot = i===0?'first':i===e.versions.length-1?'last':'mid';
    const tags = v.sources.map(([sid,dt]) => {
      const isNew = v.new_sources.includes(sid);
      return `<span class="session-tag ${isNew?'new':''}" onclick="showEntitySession('${sid}')">${sid}${isNew?' ✦':''}</span>`;
    }).join('');
    return `<div class="tl-item"><div class="tl-dot ${dot}"></div>
      <div class="tl-header"><span class="tl-step">v${i+1}</span><div class="tl-sessions">${tags}</div></div>
      <div class="tl-desc">${v.desc}</div></div>`;
  }).join('');
  const problems = e.problems.map(p=>`<div class="problem-badge">⚠ ${p}</div>`).join('');
  const stabs = allSessions.map(sid=>`<button class="session-tag" onclick="showEntitySession('${sid}')">${sid}</button>`).join('');
  return `
    <div class="card">
      <div class="entity-header"><div>
        <div class="entity-name">${e.name}</div>
        ${typePill(e.type)}
        <div style="font-family:monospace;font-size:11px;color:#374151;margin-top:4px">${e.id}</div>
      </div></div>
      ${problems?`<div style="display:flex;flex-wrap:wrap;gap:6px">${problems}</div>`:''}
    </div>
    <div>
      <div class="tabs">
        <button class="tab active" onclick="switchEntityTab('timeline',this)">Description 更新歷程</button>
        <button class="tab" onclick="switchEntityTab('rawctx',this)">Raw Context</button>
      </div>
      <div class="tab-content active" id="etab-timeline" style="margin-top:14px">
        <div class="card"><div class="card-title">更新歷程（✦ = 本次新增）</div>
          <div style="margin-top:12px"><div class="timeline">${tl}</div></div></div>
      </div>
      <div class="tab-content" id="etab-rawctx" style="margin-top:14px">
        <div class="card"><div class="card-title">Raw Context</div>
          <div class="session-selector" style="margin-top:10px">${stabs}</div>
          <div id="entity-session-display"><div class="empty-state">點選 session 查看對話</div></div>
        </div>
      </div>
    </div>`;
}
function switchEntityTab(name, btn) {
  document.querySelectorAll('#panel-entities .tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('#panel-entities .tab-content').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('etab-'+name).classList.add('active');
}
function selectEntity(key) {
  currentEntity = key;
  document.querySelectorAll('.entity-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+key)?.classList.add('active');
  document.getElementById('entity-main').innerHTML = renderEntityView(key);
}
selectEntity('camping_trip');

// ══════════════════════════════════════════════════════════
// QA PANEL
// ══════════════════════════════════════════════════════════
const CAT_COLORS = {1:'cat-1',2:'cat-2',3:'cat-3',4:'cat-4',5:'cat-4'};
const QA_META = {
  6:{cat:2,ev:'D2:7'},15:{cat:1,ev:'D5:4,D9:1'},18:{cat:1,ev:'D6:16,D4:6,D8:32'},
  19:{cat:1,ev:'D6:6,D4:8'},31:{cat:2,ev:'D4:8'},35:{cat:2,ev:'D9:1'},
  38:{cat:1,ev:'D8:4+'},40:{cat:1,ev:'D10:8,D6:16'},42:{cat:3,ev:'D10:12,D10:14'},
  57:{cat:2,ev:'D14:1'},66:{cat:1,ev:'D16:4,D10:12'},76:{cat:1,ev:'D18:17'},
  95:{cat:4,ev:'D4:8'},117:{cat:4,ev:'D10:10'},118:{cat:4,ev:'D10:14'},
  119:{cat:4,ev:'D10:18'},151:{cat:4,ev:'D18:17'}
};

function buildQASidebar() {
  if (!QA_DATA) return;
  const sb = document.getElementById('qa-sidebar');
  const idxs = Object.keys(QA_DATA).map(Number).sort((a,b)=>a-b);
  sb.innerHTML = idxs.map(idx => {
    const entry = QA_DATA[idx];
    const meta = QA_META[idx]||{};
    const dots = VER_NAMES.map(v => {
      const vd = entry.versions[v];
      if (!vd) return '';
      return `<span class="ver-dot ${vd.correct?'correct':'wrong'}" title="${v}"></span>`;
    }).join('');
    const catCls = CAT_COLORS[meta.cat]||'cat-1';
    return `<button class="qa-item-btn" id="qa-btn-${idx}" onclick="selectQA(${idx})">
      <div class="qa-meta">
        <span class="cat-badge ${catCls}">Cat ${meta.cat}</span>
        <span style="font-size:10px;color:#374151">#${idx}</span>
      </div>
      <div class="qa-q-preview">${entry.question}</div>
      <div class="score-row">${dots}</div>
    </button>`;
  }).join('');
}

function selectQA(idx) {
  currentQA = idx;
  document.querySelectorAll('.qa-item-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('qa-btn-'+idx)?.classList.add('active');
  if (!QA_DATA) return;
  const entry = QA_DATA[idx];
  const meta = QA_META[idx]||{};
  const catLabel = CAT_DESC[meta.cat]||'';

  // Version answer cards
  const cards = VER_NAMES.map(v => {
    const vd = entry.versions[v];
    if (!vd) return `<div class="ver-card"><div class="ver-name">${v}</div><div class="ver-answer" style="color:#374151">N/A</div></div>`;
    const cls = vd.correct ? 'correct-card' : 'wrong-card';
    const mark = vd.correct ? '<span class="correct-mark">✓</span>' : '<span class="wrong-mark">✗</span>';
    // strip markdown bold
    const ans = (vd.model_answer||'').replace(/\*\*/g,'').slice(0,300);
    return `<div class="ver-card ${cls}">
      <div class="ver-name">${mark} ${v}</div>
      <div class="ver-answer">${ans||'<span style="color:#374151">(no answer)</span>'}</div>
    </div>`;
  }).join('');

  // Per-version panels: two sub-tabs each (KG context + Summaries)
  const ctxTabs = VER_NAMES.map((v,i)=>
    `<button class="ctx-tab ${i===0?'active':''}" id="ctxtab-${v}" onclick="switchCtxTab('${v}',this)">${v}</button>`
  ).join('');

  const ctxPanels = VER_NAMES.map((v,i) => {
    const vd = entry.versions[v];
    const ctx = vd ? (vd.retrieved_context||'(empty)') : 'N/A';
    const conf = vd ? (vd.retrieval_confidence||'') : '';
    const fail = vd ? (vd.retrieval_failure_type||'') : '';
    const cnt  = vd ? (vd.selected_evidence_count||'') : '';
    const summaries = (vd && vd.summaries) ? vd.summaries : [];

    // Gold coverage: evidence D{N}:{M} → summary id 0__{N}:0
    const goldEvidence = entry.evidence || [];
    const goldSumIds = goldEvidence.map(e => {
      const m = e.match(/^D(\d+):/);
      return m ? `0__${m[1]}:0` : null;
    }).filter(Boolean);
    const retrievedIds = new Set(summaries.map(s => (typeof s === 'object') ? s.id : s));
    const goldHit  = goldSumIds.filter(g => retrievedIds.has(g));
    const goldMiss = goldSumIds.filter(g => !retrievedIds.has(g));
    const goldTotal = goldSumIds.length;
    let goldBadge = '';
    if (goldTotal > 0) {
      const ratio = `${goldHit.length}/${goldTotal}`;
      const color = goldHit.length === goldTotal ? '#22c55e' : goldHit.length === 0 ? '#ef4444' : '#f59e0b';
      const missTip = goldMiss.length ? ` — missing: ${goldMiss.join(', ')}` : '';
      goldBadge = `<span title="Gold summaries retrieved${missTip}" style="font-size:10px;font-weight:700;color:${color};background:${color}18;border:1px solid ${color}44;border-radius:4px;padding:1px 7px;cursor:default">gold ${ratio}${missTip ? ' ⚠' : ''}</span>`;
    }

    const sumHtml = [
      goldTotal > 0 ? `<div style="padding:8px 12px 4px;border-bottom:1px solid #1e2535">
        <span style="font-size:10px;color:#6b7280;font-weight:600">GOLD EVIDENCE SESSIONS: </span>
        ${goldSumIds.map(g => {
          const hit = retrievedIds.has(g);
          return `<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:4px;color:${hit?'#22c55e':'#ef4444'};background:${hit?'#22c55e18':'#ef444418'};border:1px solid ${hit?'#22c55e44':'#ef444444'}">${g}${hit?' ✓':' ✗'}</span>`;
        }).join('')}
        ${goldMiss.length ? `<span style="font-size:10px;color:#6b7280">— ${goldMiss.length} session(s) not retrieved</span>` : ''}
      </div>` : '',
      ...summaries.map((s,si)=>{
        const sid  = (typeof s === 'object') ? (s.id  || `#${si+1}`) : `#${si+1}`;
        const text = (typeof s === 'object') ? (s.text || '') : s;
        const isGold = goldSumIds.includes(sid);
        return `<div style="border:1px solid ${isGold?'#22c55e44':'#2d3748'};border-radius:6px;padding:10px 12px;margin-bottom:8px;${isGold?'background:#22c55e08':''}">
          <div style="font-size:10px;margin-bottom:4px;font-weight:700;display:flex;align-items:center;gap:6px">
            <span style="color:#94a3b8">Summary ${si+1}</span>
            <span style="color:#374151;font-weight:400">[${escHtml(sid)}]</span>
            ${isGold ? '<span style="color:#22c55e;font-size:9px;background:#22c55e18;border:1px solid #22c55e44;border-radius:3px;padding:0 5px">GOLD</span>' : ''}
          </div>
          <div style="font-family:monospace;font-size:12px;color:#94a3b8;line-height:1.6;white-space:pre-wrap">${escHtml(text)}</div>
        </div>`;
      })
    ].filter(Boolean).join('') || '<div style="color:#374151;padding:20px;text-align:center">No summaries</div>';

    return `<div class="ctx-panel" id="ctxpanel-${v}" style="display:${i===0?'block':'none'}">
      <div style="padding:7px 14px;border-bottom:1px solid #2d3748;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#141722">
        <span class="ctx-ver-name">${v}</span>
        ${cnt?`<span class="ctx-conf">${cnt} summaries retrieved</span>`:''}
        ${goldBadge}
        ${conf?`<span class="ctx-conf">confidence: ${conf}</span>`:''}
        ${fail?`<span class="ctx-fail">⚠ ${fail}</span>`:''}
      </div>
      <div style="display:flex;border-bottom:1px solid #2d3748;background:#0f1117">
        <button class="ctx-subtab active" id="subtab-${v}-kg" onclick="switchSubTab('${v}','kg',this)" style="padding:6px 14px;font-size:11px;color:#818cf8;border:none;border-bottom:2px solid #818cf8;background:none;cursor:pointer">KG Entities & Relations</button>
        <button class="ctx-subtab" id="subtab-${v}-sum" onclick="switchSubTab('${v}','sum',this)" style="padding:6px 14px;font-size:11px;color:#4a5568;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer">Summaries (${summaries.length})</button>
      </div>
      <div id="subpanel-${v}-kg" class="ctx-body">${escHtml(ctx)}</div>
      <div id="subpanel-${v}-sum" style="display:none;padding:12px 14px;max-height:380px;overflow-y:auto">${sumHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('qa-main').innerHTML = `
    <div class="qa-header-card">
      <div class="qa-question">${entry.question}</div>
      <div class="qa-gold">
        <span class="qa-gold-label">Gold:</span>
        <span class="qa-gold-val">${entry.gold_answer||'(unanswerable)'}</span>
      </div>
      <div class="qa-evidence">Evidence: ${meta.ev||entry.evidence?.join(', ')||'—'} &nbsp;·&nbsp; Category ${meta.cat}: ${catLabel}</div>
    </div>

    <div class="ver-grid">${cards}</div>

    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:10px 14px 0;background:#141722;border-bottom:1px solid #2d3748">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#4a5568;margin-bottom:6px">Retrieved Context per Version</div>
        <div style="display:flex;gap:0">${ctxTabs}</div>
      </div>
      ${ctxPanels}
    </div>`;
}

function switchCtxTab(v, btn) {
  document.querySelectorAll('.ctx-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.ctx-panel').forEach(p=>p.style.display='none');
  btn.classList.add('active');
  document.getElementById('ctxpanel-'+v).style.display='block';
}

function switchSubTab(v, tab, btn) {
  // toggle KG vs Summaries sub-panels within one version panel
  ['kg','sum'].forEach(t => {
    const p = document.getElementById(`subpanel-${v}-${t}`);
    const b = document.getElementById(`subtab-${v}-${t}`);
    if (t === tab) {
      p.style.display = t==='kg' ? 'block' : 'block';
      b.style.color = '#818cf8';
      b.style.borderBottomColor = '#818cf8';
    } else {
      p.style.display = 'none';
      b.style.color = '#4a5568';
      b.style.borderBottomColor = 'transparent';
    }
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderGT() {
  const items = GROUND_TRUTH.map(g => {
    const status = g.ok
      ? `<span style="color:#22c55e;font-size:12px;font-weight:700">✓ 各版本處理尚可</span>`
      : `<span style="color:#ef4444;font-size:12px;font-weight:700">✗ 所有版本都有問題</span>`;
    return `<div class="gt-entity">
      <div class="gt-entity-name">${g.name} ${status}</div>
      <span class="gt-type">${g.type}</span>
      <div style="font-size:12px;color:#4a5568;margin-bottom:6px">📅 ${g.date} &nbsp;|&nbsp; 📌 ${g.source}</div>
      <div class="gt-desc">${g.desc}</div>
      <div class="gt-note">💡 ${g.note}</div>
    </div>`;
  }).join('');

  document.getElementById('gt-main').innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Ground Truth — 正確應該抽出的 Entities</div>
      <div style="margin-top:4px;color:#4a5568;font-size:12px">Melanie 的露營共有 <strong style="color:#f0f4ff">6 次不同事件</strong>，每次地點/時間/背景都不同。</div>
    </div>
    <div class="card" style="margin-bottom:16px">${items}</div>
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">五版本問題對比</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="border-bottom:1px solid #2d3748">
          <th style="text-align:left;padding:8px;color:#4a5568">問題</th>
          <th style="padding:8px;color:#818cf8">relation</th>
          <th style="padding:8px;color:#f59e0b">oss-0515</th>
          <th style="padding:8px;color:#34d399">tmp_fix</th>
          <th style="padding:8px;color:#f87171">update</th>
          <th style="padding:8px;color:#a78bfa">oss-0618</th>
        </tr></thead>
        <tbody>${[
          ["計劃 vs 實際分開","✗","✓","✓","✗","✗"],
          ["海灘獨立 entity","✗","✓","✗","✓","✓"],
          ["森林獨立 entity (0__8)","✗","✗","✗","✗","完全未抽"],
          ["Perseid 獨立 entity","✗","✓(日期錯)","✓","✗","✓(日期錯)"],
          ["Aug camping 獨立","✗","✗","✗","✗","✓"],
          ["Entity 膨脹程度","中","最輕","最嚴重","嚴重","輕但有漏"],
          ["露營題答對率","6/17","12/17","9/17","7/17","5/17"],
        ].map(([label,...vals])=>`<tr style="border-bottom:1px solid #1a1d2e">
          <td style="padding:8px;color:#cbd5e1">${label}</td>
          ${vals.map(v=>{
            const good=v.startsWith('✓')||v.includes('最輕')||v==='中'||v.includes('12')||v.includes('9/17');
            const bad=v.startsWith('✗')||v.includes('嚴重')||v.includes('漏')||v.includes('5/17')||v.includes('6/17')||v.includes('7/17');
            const col=good?'#22c55e':bad?'#ef4444':'#f59e0b';
            return `<td style="text-align:center;padding:8px;color:${col}">${v}</td>`;
          }).join('')}
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

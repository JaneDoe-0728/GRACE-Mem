<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoCoMo QA Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c14;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Top bar ── */
#topbar{background:#111827;border-bottom:1px solid #1e2535;padding:0 16px;display:flex;align-items:center;gap:16px;flex-shrink:0;height:44px}
#topbar h1{font-size:14px;font-weight:700;color:#818cf8;white-space:nowrap}
#sample-tabs{display:flex;gap:2px}
.stab{padding:4px 10px;font-size:11px;font-weight:600;border:1px solid #2d3748;border-radius:4px;cursor:pointer;background:#0f1117;color:#4a5568;transition:all .15s}
.stab.active{background:#818cf8;color:#fff;border-color:#818cf8}
.stab:hover:not(.active){background:#1e2535;color:#94a3b8}
#loading-bar{font-size:11px;color:#f59e0b;margin-left:auto;white-space:nowrap}
#score-strip{display:flex;gap:8px;margin-left:auto;align-items:center}
.score-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid}

/* ── Filter bar ── */
#filterbar{background:#0f1117;border-bottom:1px solid #1e2535;padding:5px 12px;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
#q-search{background:#141722;border:1px solid #2d3748;border-radius:4px;color:#e2e8f0;padding:4px 8px;font-size:12px;width:200px}
#q-search:focus{outline:none;border-color:#818cf8}
.filter-label{font-size:10px;color:#4a5568;font-weight:600}
#cat-filter{background:#141722;border:1px solid #2d3748;border-radius:4px;color:#e2e8f0;padding:3px 6px;font-size:11px}
#ver-filter{background:#141722;border:1px solid #2d3748;border-radius:4px;color:#e2e8f0;padding:3px 6px;font-size:11px}
#filter-result{font-size:10px;color:#4a5568;margin-left:4px}

/* ── Main layout ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── Sidebar ── */
#sidebar{width:300px;flex-shrink:0;border-right:1px solid #1e2535;display:flex;flex-direction:column;overflow:hidden}
#q-list{flex:1;overflow-y:auto;padding:4px}
.q-item{padding:7px 8px;border-radius:5px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;transition:background .1s}
.q-item:hover{background:#141722}
.q-item.active{background:#1a1f35;border-color:#4a5568}
.q-item-top{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.q-idx{font-size:10px;font-weight:700;color:#374151;min-width:24px}
.q-cat{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px}
.q-dots{display:flex;gap:3px;margin-left:auto}
.qdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.q-text{font-size:11px;color:#94a3b8;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ── Content ── */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden}
#q-header{padding:12px 16px;border-bottom:1px solid #1e2535;background:#0f1117;flex-shrink:0}
#q-question{font-size:15px;font-weight:600;color:#e2e8f0;margin-bottom:6px;line-height:1.4}
#q-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.q-gold-label{font-size:10px;color:#4a5568;font-weight:600}
.q-gold-val{font-size:12px;color:#22c55e;font-weight:600}
.q-ev{font-size:10px;color:#4a5568}
.q-cat-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px}

#ver-panels-wrap{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}

/* ── Version panel ── */
.ver-panel{border:1px solid #2d3748;border-radius:8px;overflow:hidden;background:#0f1117}
.ver-panel-header{padding:7px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#141722;border-bottom:1px solid #1e2535}
.ver-name{font-size:11px;font-weight:700;color:#818cf8}
.correctness-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.badge-correct{background:#22c55e18;color:#22c55e;border:1px solid #22c55e44}
.badge-wrong{background:#ef444418;color:#ef4444;border:1px solid #ef444444}
.badge-na{background:#37414118;color:#374141;border:1px solid #37414144}
.conf-badge{font-size:10px;color:#4a5568;padding:2px 6px;border:1px solid #2d3748;border-radius:3px}
.fail-badge{font-size:10px;color:#f59e0b;background:#f59e0b18;border:1px solid #f59e0b44;padding:2px 6px;border-radius:3px}
.gold-cov-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;cursor:default}

.ver-answer{padding:8px 12px;font-size:12px;color:#94a3b8;border-bottom:1px solid #1e2535;line-height:1.5}
.ver-answer-label{font-size:9px;font-weight:700;color:#4a5568;text-transform:uppercase;margin-bottom:2px}

/* sub-tabs */
.subtab-bar{display:flex;border-bottom:1px solid #1e2535;background:#0a0c14}
.subtab-btn{padding:5px 14px;font-size:11px;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;color:#4a5568;transition:all .1s}
.subtab-btn.active{color:#818cf8;border-bottom-color:#818cf8}
.ctx-body{padding:10px 12px;font-family:monospace;font-size:11px;color:#94a3b8;white-space:pre-wrap;max-height:280px;overflow-y:auto;line-height:1.5}
.sum-body{padding:10px 12px;max-height:340px;overflow-y:auto}
.sum-card{border-radius:5px;padding:8px 10px;margin-bottom:7px;border:1px solid #2d3748}
.sum-card.gold{border-color:#22c55e44;background:#22c55e06}
.sum-card-hdr{font-size:10px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.sum-card-hdr-id{color:#4a5568}
.sum-tag-gold{font-size:9px;color:#22c55e;background:#22c55e18;border:1px solid #22c55e44;border-radius:3px;padding:0 5px}
.sum-card-text{font-family:monospace;font-size:11px;color:#94a3b8;white-space:pre-wrap;line-height:1.5}
.gold-session-row{padding:6px 10px 4px;border-bottom:1px solid #1e2535;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.gs-tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px}

/* placeholder */
#placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:#374151;font-size:13px}

/* ── Colors ── */
.cat-1{background:#3b82f618;color:#3b82f6;border:1px solid #3b82f644}
.cat-2{background:#8b5cf618;color:#8b5cf6;border:1px solid #8b5cf644}
.cat-3{background:#f59e0b18;color:#f59e0b;border:1px solid #f59e0b44}
.cat-4{background:#06b6d418;color:#06b6d4;border:1px solid #06b6d444}
.cat-5{background:#6b728018;color:#6b7280;border:1px solid #6b728044}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0a0c14}
::-webkit-scrollbar-thumb{background:#2d3748;border-radius:3px}
</style>
</head>
<body>

<div id="topbar">
  <h1>LoCoMo QA Viewer</h1>
  <div id="sample-tabs"></div>
  <div id="score-strip"></div>
  <div id="loading-bar" style="display:none">Loading...</div>
</div>

<div id="filterbar">
  <span class="filter-label">SEARCH</span>
  <input id="q-search" type="text" placeholder="question text..." oninput="applyFilters()">
  <span class="filter-label">CATEGORY</span>
  <select id="cat-filter" onchange="applyFilters()">
    <option value="">All</option>
    <option value="4">Single-hop</option>
    <option value="1">Multi-hop</option>
    <option value="2">Temporal</option>
    <option value="3">Open-domain</option>
    <option value="5">(unevaluated)</option>
  </select>
  <span class="filter-label">VERSION</span>
  <select id="ver-filter" onchange="applyFilters()">
    <option value="">All</option>
    <option value="correct">Correct in all</option>
    <option value="wrong">Wrong in all</option>
    <option value="disagree">Versions disagree</option>
  </select>
  <span id="filter-result"></span>
</div>

<div id="main">
  <div id="sidebar">
    <div id="q-list"></div>
  </div>
  <div id="content">
    <div id="placeholder">← Select a question</div>
  </div>
</div>

<script>
const VER_NAMES = ['relation','oss-0515','oss-0618'];
const VER_COLORS = {
  'relation': '#818cf8',
  'oss-0515': '#06b6d4',
  'tmp_fix':  '#f59e0b',
  'update':   '#22c55e',
  'oss-0618': '#f472b6',
};
const CAT_LABELS = {
  '1':'Multi-hop','2':'Temporal','3':'Open-domain','4':'Single-hop','5':'(unevaluated)'
};

let currentSample = 0;
let sampleData = null;   // {q_idx: entry, ...}
let filteredKeys = [];
let selectedQ = null;

// ── Helpers ──────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function catClass(c) { return `cat-${c||5}`; }

function dotColor(vd) {
  if (!vd) return '#1e2535';
  return vd.correct ? '#22c55e' : '#ef4444';
}

function dotTitle(v, vd) {
  if (!vd) return `${v}: N/A`;
  return `${v}: ${vd.correct ? '✓ Correct' : '✗ Wrong'}`;
}

// ── Sample tabs ───────────────────────────────────────────────────────────────
(function buildSampleTabs() {
  const wrap = document.getElementById('sample-tabs');
  for (let i = 0; i < 10; i++) {
    const b = document.createElement('button');
    b.className = 'stab' + (i === 0 ? ' active' : '');
    b.textContent = `S${i}`;
    b.onclick = () => loadSample(i, b);
    wrap.appendChild(b);
  }
})();

// ── Load sample ───────────────────────────────────────────────────────────────
async function loadSample(idx, btn) {
  if (idx === currentSample && sampleData) return;
  // update tabs
  document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSample = idx;
  selectedQ = null;

  const lb = document.getElementById('loading-bar');
  lb.style.display = 'block';
  lb.textContent = `Loading sample ${idx}...`;

  try {
    const resp = await fetch(`all_qa_s${idx}.json`);
    sampleData = await resp.json();
  } catch(e) {
    lb.textContent = `Error: ${e}`;
    return;
  }

  lb.style.display = 'none';
  buildScoreStrip();
  applyFilters();
  document.getElementById('content').innerHTML = '<div id="placeholder" style="flex:1;display:flex;align-items:center;justify-content:center;color:#374151;font-size:13px">← Select a question</div>';
}

// ── Score strip ───────────────────────────────────────────────────────────────
function buildScoreStrip() {
  const strip = document.getElementById('score-strip');
  const counts = {};
  VER_NAMES.forEach(v => counts[v] = {ok:0, tot:0, goldHit:0, goldTot:0});

  Object.values(sampleData).forEach(entry => {
    const goldSumIds = entry.gold_summary_ids || [];
    VER_NAMES.forEach(v => {
      const vd = entry.versions[v];
      if (!vd) return;
      counts[v].tot++;
      if (vd.correct) counts[v].ok++;
      // gold summary retrieval
      if (goldSumIds.length > 0) {
        const retrievedIds = new Set((vd.summaries||[]).map(s => (typeof s==='object') ? s.id : s));
        counts[v].goldTot += goldSumIds.length;
        counts[v].goldHit += goldSumIds.filter(g => retrievedIds.has(g)).length;
      }
    });
  });

  strip.innerHTML = VER_NAMES.map(v => {
    const {ok, tot, goldHit, goldTot} = counts[v];
    const pct     = tot     ? Math.round(ok/tot*100)         : 0;
    const goldPct = goldTot ? Math.round(goldHit/goldTot*100): 0;
    const col = VER_COLORS[v];
    const qaTitle   = `${v} QA: ${ok}/${tot}`;
    const goldTitle = `${v} Gold Summary Recall: ${goldHit}/${goldTot}`;
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:${col}0d;border:1px solid ${col}33;border-radius:5px;padding:2px 8px">
      <span class="score-chip" title="${qaTitle}"  style="color:${col};border:none;background:none;padding:0;font-size:10px;font-weight:700">${v}</span>
      <span title="${qaTitle}"   style="font-size:10px;color:${col};font-weight:600">QA ${pct}%</span>
      <span style="color:#2d3748">|</span>
      <span title="${goldTitle}" style="font-size:10px;color:${col};opacity:.75;font-weight:600">G-Rec ${goldPct}%</span>
      <span title="${goldTitle}" style="font-size:9px;color:#4a5568">${goldHit}/${goldTot}</span>
    </span>`;
  }).join('');
}

// ── Filters ───────────────────────────────────────────────────────────────────
function applyFilters() {
  if (!sampleData) return;
  const search = document.getElementById('q-search').value.toLowerCase();
  const cat    = document.getElementById('cat-filter').value;
  const vf     = document.getElementById('ver-filter').value;

  filteredKeys = Object.keys(sampleData).filter(k => {
    const e = sampleData[k];
    if (search && !e.question.toLowerCase().includes(search)) return false;
    if (cat && String(e.category) !== cat) return false;
    if (vf) {
      const results = VER_NAMES.map(v => e.versions[v]).filter(Boolean);
      const corrects = results.filter(vd => vd.correct).length;
      if (vf === 'correct' && corrects !== results.length) return false;
      if (vf === 'wrong'   && corrects !== 0) return false;
      if (vf === 'disagree' && (corrects === 0 || corrects === results.length)) return false;
    }
    return true;
  });

  document.getElementById('filter-result').textContent = `${filteredKeys.length} / ${Object.keys(sampleData).length}`;
  renderSidebar();
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('q-list');
  list.innerHTML = filteredKeys.map(k => {
    const e = sampleData[k];
    const cat = String(e.category||5);
    const dots = VER_NAMES.map(v => {
      const col = dotColor(e.versions[v]);
      const tt = dotTitle(v, e.versions[v]);
      return `<span class="qdot" style="background:${col}" title="${tt}"></span>`;
    }).join('');
    const active = selectedQ === k ? ' active' : '';
    return `<div class="q-item${active}" onclick="selectQ('${k}')">
      <div class="q-item-top">
        <span class="q-idx">#${parseInt(k)+1}</span>
        <span class="q-cat ${catClass(cat)}">${CAT_LABELS[cat]||cat}</span>
        <span class="q-dots">${dots}</span>
      </div>
      <div class="q-text">${escHtml(e.question)}</div>
    </div>`;
  }).join('');
}

// ── Select question ───────────────────────────────────────────────────────────
function selectQ(k) {
  selectedQ = k;

  // update active state
  document.querySelectorAll('.q-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.q-item[onclick="selectQ('${k}')"]`);
  if (el) el.classList.add('active');

  const entry = sampleData[k];
  renderDetail(entry);
}

// ── Detail view ───────────────────────────────────────────────────────────────
function renderDetail(entry) {
  const cat = String(entry.category||5);
  const goldSumIds = entry.gold_summary_ids || [];

  const headerHtml = `
    <div id="q-header">
      <div id="q-question">${escHtml(entry.question)}</div>
      <div id="q-meta">
        <span class="q-cat-badge ${catClass(cat)}">${CAT_LABELS[cat]||cat}</span>
        <span class="q-gold-label">Gold:</span>
        <span class="q-gold-val">${escHtml(entry.gold_answer)||'(unanswerable)'}</span>
        <span class="q-ev">Evidence: ${(entry.evidence||[]).join(', ')||'—'}</span>
      </div>
    </div>`;

  const panelsHtml = VER_NAMES.map(v => buildVerPanel(v, entry.versions[v], goldSumIds)).join('');

  document.getElementById('content').innerHTML = `
    ${headerHtml}
    <div id="ver-panels-wrap">${panelsHtml}</div>`;
}

function buildVerPanel(v, vd, goldSumIds) {
  const color = VER_COLORS[v];

  if (!vd) {
    return `<div class="ver-panel">
      <div class="ver-panel-header">
        <span class="ver-name" style="color:${color}">${v}</span>
        <span class="correctness-badge badge-na">N/A</span>
      </div>
    </div>`;
  }

  const corrBadge = vd.correct
    ? '<span class="correctness-badge badge-correct">✓ Correct</span>'
    : '<span class="correctness-badge badge-wrong">✗ Wrong</span>';

  const confBadge = vd.retrieval_confidence
    ? `<span class="conf-badge">conf: ${escHtml(vd.retrieval_confidence)}</span>` : '';
  const failBadge = vd.retrieval_failure_type
    ? `<span class="fail-badge">⚠ ${escHtml(vd.retrieval_failure_type)}</span>` : '';

  // gold coverage
  const summaries = vd.summaries || [];
  const retrievedIds = new Set(summaries.map(s => (typeof s === 'object') ? s.id : s));
  const goldHit  = goldSumIds.filter(g => retrievedIds.has(g));
  const goldMiss = goldSumIds.filter(g => !retrievedIds.has(g));
  let goldBadge = '';
  if (goldSumIds.length > 0) {
    const ratio = `${goldHit.length}/${goldSumIds.length}`;
    const col = goldHit.length === goldSumIds.length ? '#22c55e' : goldHit.length === 0 ? '#ef4444' : '#f59e0b';
    const missTip = goldMiss.length ? ` — missing: ${goldMiss.join(', ')}` : '';
    goldBadge = `<span class="gold-cov-badge" title="Gold summaries retrieved${escHtml(missTip)}" style="color:${col};background:${col}18;border:1px solid ${col}44">gold ${ratio}${goldMiss.length?' ⚠':''}</span>`;
  }

  const evCount = vd.selected_evidence_count
    ? `<span class="conf-badge">${escHtml(vd.selected_evidence_count)} retrieved</span>` : '';

  // summaries panel
  const goldSessionRow = goldSumIds.length ? `<div class="gold-session-row">
    <span style="font-size:9px;color:#4a5568;font-weight:700;margin-right:2px">GOLD:</span>
    ${goldSumIds.map(g => {
      const hit = retrievedIds.has(g);
      const col = hit ? '#22c55e' : '#ef4444';
      return `<span class="gs-tag" style="color:${col};background:${col}18;border:1px solid ${col}44">${escHtml(g)} ${hit?'✓':'✗'}</span>`;
    }).join('')}
    ${goldMiss.length ? `<span style="font-size:9px;color:#6b7280">${goldMiss.length} missing</span>` : ''}
  </div>` : '';

  const sumCards = summaries.map((s, si) => {
    const sid  = (typeof s === 'object') ? (s.id  || `#${si+1}`) : `#${si+1}`;
    const text = (typeof s === 'object') ? (s.text || '') : s;
    const isGold = goldSumIds.includes(sid);
    return `<div class="sum-card${isGold?' gold':''}">
      <div class="sum-card-hdr">
        <span style="font-size:10px;font-weight:700;color:#94a3b8">Summary ${si+1}</span>
        <span class="sum-card-hdr-id">[${escHtml(sid)}]</span>
        ${isGold ? '<span class="sum-tag-gold">GOLD</span>' : ''}
      </div>
      <div class="sum-card-text">${escHtml(text)}</div>
    </div>`;
  }).join('') || '<div style="color:#374151;padding:16px;text-align:center;font-size:11px">No summaries</div>';

  const uid = `${v}_${Math.random().toString(36).slice(2,7)}`;

  return `<div class="ver-panel">
    <div class="ver-panel-header">
      <span class="ver-name" style="color:${color}">${v}</span>
      ${corrBadge}
      ${evCount}
      ${goldBadge}
      ${confBadge}
      ${failBadge}
    </div>
    <div class="ver-answer">
      <div class="ver-answer-label">Model Answer</div>
      ${escHtml(vd.model_answer||'(no answer)')}
    </div>
    <div class="subtab-bar">
      <button class="subtab-btn active" id="stb-${uid}-kg" onclick="switchSub('${uid}','kg',this)">KG Context</button>
      <button class="subtab-btn" id="stb-${uid}-sum" onclick="switchSub('${uid}','sum',this)">Summaries (${summaries.length})</button>
    </div>
    <div id="sp-${uid}-kg" class="ctx-body">${escHtml(vd.retrieved_context||'(empty)')}</div>
    <div id="sp-${uid}-sum" style="display:none">
      ${goldSessionRow}
      <div class="sum-body">${sumCards}</div>
    </div>
  </div>`;
}

function switchSub(uid, tab, btn) {
  document.getElementById(`sp-${uid}-kg`).style.display  = tab==='kg'  ? '' : 'none';
  document.getElementById(`sp-${uid}-sum`).style.display = tab==='sum' ? '' : 'none';
  document.querySelectorAll(`[id^="stb-${uid}-"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadSample(0, document.querySelector('.stab'));
</script>
</body>
</html>

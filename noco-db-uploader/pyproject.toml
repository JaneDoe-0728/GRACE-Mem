[project]
name = "noco-db-uploader"
version = "0.1.0"
description = "Upload Excel files to NocoDB database"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
noco-upload = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[dependency-groups]
dev = []
